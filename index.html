<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte de Visite Virtuelle</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

   <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Plus Jakarta Sans', sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #0f172a;
    overflow: hidden;
    position: relative;
}

/* Orbes lumineux en arrière-plan */
.circle {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    z-index: 0;
}

.circle-1 {
    width: 300px;
    height: 300px;
    background: #6366f1;
    top: 15%;
    left: 20%;
}

.circle-2 {
    width: 250px;
    height: 250px;
    background: #ec4899;
    bottom: 15%;
    right: 20%;
}

/* Carte Glassmorphism */
.card-container {
    position: relative;
    width: 360px;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 24px;
    padding: 32px 24px;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
    z-index: 1;
    transform-style: preserve-3d;
    transition: transform 0.1s ease-out;
}

.card-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    transform: translateZ(30px); /* Donne de la profondeur */
}

/* Avatar */
.avatar-box {
    position: relative;
    margin-bottom: 16px;
}

.avatar-box img {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid rgba(255, 255, 255, 0.3);
}

.status-badge {
    position: absolute;
    bottom: 6px;
    right: 6px;
    width: 14px;
    height: 14px;
    background-color: #10b981;
    border: 2px solid #0f172a;
    border-radius: 50%;
}

/* Informations utilisateur */
.user-info h2 {
    color: #ffffff;
    font-size: 1.35rem;
    font-weight: 700;
}

.user-info .title {
    color: #818cf8;
    font-size: 0.9rem;
    font-weight: 600;
    margin-top: 4px;
}

.user-info .location {
    color: #94a3b8;
    font-size: 0.8rem;
    margin-top: 4px;
}

.bio {
    color: #cbd5e1;
    font-size: 0.85rem;
    line-height: 1.4;
    margin: 18px 0;
}

/* Réseaux sociaux */
.social-links {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
}

.social-btn {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    text-decoration: none;
    transition: all 0.3s ease;
}

.social-btn:hover {
    background: #6366f1;
    transform: translateY(-3px);
    box-shadow: 0 8px 16px rgba(99, 102, 241, 0.3);
}

/* Boutons d'action */
.actions {
    display: flex;
    gap: 12px;
    width: 100%;
}

.btn {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    transition: all 0.3s ease;
    border: none;
}

.btn-primary {
    background: linear-gradient(135deg, #6366f1, #4f46e5);
    color: #ffffff;
}

.btn-primary:hover {
    opacity: 0.9;
    box-shadow: 0 8px 16px rgba(79, 70, 229, 0.3);
}

.btn-secondary {
    background: rgba(255, 255, 255, 0.1);
    color: #ffffff;
    border: 1px solid rgba(255, 255, 255, 0.2);
}

.btn-secondary:hover {
    background: rgba(255, 255, 255, 0.2);
}
   </style>

</head>


<body>

    <!-- Arrière-plan dynamique (orbes lumineux) -->
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>

    <!-- Carte principale -->
    <div class="card-container" id="card">
        <div class="card-content">
            <div class="avatar-box">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" alt="Photo de profil">
                <span class="status-badge"></span>
            </div>

            <div class="user-info">
                <h2>Alexandre Martin</h2>
                <p class="title">Lead UI/UX Designer & Dev</p>
                <p class="location"><i class="fa-solid fa-location-dot"></i> Paris, France</p>
            </div>

            <p class="bio">
                Je crée des expériences numériques élégantes, modernes et intuitives. Passionné par l'innovation web.
            </p>

            <div class="social-links">
                <a href="#" class="social-btn" title="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
                <a href="#" class="social-btn" title="GitHub"><i class="fa-brands fa-github"></i></a>
                <a href="#" class="social-btn" title="Twitter/X"><i class="fa-brands fa-x-twitter"></i></a>
                <a href="#" class="social-btn" title="Dribbble"><i class="fa-brands fa-dribbble"></i></a>
            </div>

            <div class="actions">
                <a href="mailto:contact@exemple.com" class="btn btn-primary"><i class="fa-solid fa-paper-plane"></i> Me Contacter</a>
                <button class="btn btn-secondary" onclick="downloadVCard()"><i class="fa-solid fa-user-plus"></i> Enregistrer</button>
            </div>
        </div>
    </div>

    <script >
        // Effet d'inclinaison 3D au survol de la souris
const card = document.getElementById('card');

document.addEventListener('mousemove', (e) => {
    // Calcul de la position du curseur par rapport au centre de l'écran
    const xAxis = (window.innerWidth / 2 - e.pageX) / 20;
    const yAxis = (window.innerHeight / 2 - e.pageY) / 20;
    
    // Application de la rotation
    card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
});

// Réinitialisation de la position quand la souris sort de l'écran
document.addEventListener('mouseleave', () => {
    card.style.transform = 'rotateY(0deg) rotateX(0deg)';
});

// Simulation de téléchargement de contact (vCard)
function downloadVCard() {
    alert("Fonctionnalité : Téléchargement du fichier .vcf pour enregistrer le contact sur votre téléphone !");
}
    </script>
</body>

</html>
